name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact: issue-tracker
            asset: issue-tracker-linux-amd64
          - os: windows-latest
            artifact: issue-tracker.exe
            asset: issue-tracker-windows-amd64.exe
          - os: macos-latest
            artifact: issue-tracker
            asset: issue-tracker-macos-amd64
    steps:
      - uses: actions/checkout@v4
      - name: Install D
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Build CLI
        run: dub build --config=cli --build=release
      - name: Rename artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv issue-tracker.exe ${{ matrix.asset }}
          else
            mv issue-tracker ${{ matrix.asset }}
          fi
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.asset }}
          draft: false
