name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build site
        run: pnpm run build
      - name: Add Pages root redirect
        run: |
          printf '%s\n' \
            '<!DOCTYPE html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=issue-tracker/">' \
            '<link rel="canonical" href="issue-tracker/">' \
            '<title>Issue Tracker</title>' \
            "<script>location.replace('issue-tracker/')</script>" \
            '<p><a href="issue-tracker/">Issue Tracker documentation</a></p>' \
            > public/index.html
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
