name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install D
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: dmd-latest
      - name: Build CLI
        run: dub build --config=cli
  build-library:
    name: Build library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install D
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: dmd-latest
      - name: Build library
        run: dub build --config=library
