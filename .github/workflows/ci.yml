name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.config }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            config: cli
          - os: ubuntu-24.04-arm
            config: cli
          - os: windows-latest
            config: cli
          - os: windows-11-arm
            config: cli
          - os: macos-latest
            config: cli
          - os: ubuntu-latest
            config: library
          - os: windows-latest
            config: library
          - os: ubuntu-latest
            config: daemon
          - os: windows-latest
            config: daemon
    steps:
      - uses: actions/checkout@v4
      - name: Install D
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Build
        run: dub build --config=${{ matrix.config }}

  build-tray:
    name: Build tray ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install D
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev
      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        run: brew install qt
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.7.3 win64_msvc2019_64 -O "$env:RUNNER_TEMP\Qt"
          $qt = Get-ChildItem "$env:RUNNER_TEMP\Qt\6.7.3" -Directory | Select-Object -First 1
          "DFLAGS=-L/LIBPATH:$($qt.FullName)\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PATH=$($qt.FullName)\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Qt paths (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PATH=$(brew --prefix qt)/bin:$PATH" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix qt)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Build tray
        run: dub build --config=tray
